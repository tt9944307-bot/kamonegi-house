<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const FONT = '"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif';
const ALL_TEXT = 'カモネギハウスKAMONEGI HOUSE鴨葱作戦室ネギ畑四季の並木ようこそ！親しき中にも礼儀ありクラン掲示板トリオでカスタム、やってます鴨がネギを背負ってやってくる0123456789/ 残り部隊SQUADCHAMPION!';
try {
  await Promise.race([
    document.fonts.load(`800 48px "M PLUS Rounded 1c"`, ALL_TEXT),
    new Promise(r => setTimeout(r, 3000)),
  ]);
} catch (e) {}

// deterministic random so the layout is the same on every load
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(610);

// ---------- renderer / scene / camera
const renderer = new THREE.WebGLRenderer({antialias:true});
const coarse = matchMedia('(pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const DAY_SKY = new THREE.Color('#9fd3f0'), NIGHT_SKY = new THREE.Color('#0f1630');
scene.background = DAY_SKY.clone();
scene.fog = new THREE.Fog(DAY_SKY.clone(), 70, 150);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(34, 26, 38);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1, 3, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 6; controls.maxDistance = 130;
// narrow (portrait) screens start further out so the whole island fits
const fit = () => Math.min(2.2, Math.max(1, 1.3 / (innerWidth/innerHeight)));
camera.position.sub(controls.target).multiplyScalar(fit()).add(controls.target);
const fitFog = () => { scene.fog.near = 70*fit(); scene.fog.far = 150*fit(); };
fitFog();
controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
let fly = null;
controls.addEventListener('start', () => { fly = null; });

// ---------- lights
const hemi = new THREE.HemisphereLight('#ffffff', '#5b7d3a', 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff3d6', 2.2);
sun.position.set(25, 40, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(coarse ? 1024 : 2048, coarse ? 1024 : 2048);
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, {left:-40, right:40, top:40, bottom:-40, near:1, far:120});
scene.add(sun);
const moon = new THREE.DirectionalLight('#8fa8ff', 0);
moon.position.set(-20, 30, -10); scene.add(moon);

// ---------- helpers
const M = (c, o={}) => new THREE.MeshStandardMaterial({color:c, roughness:0.8, ...o});
const hoverables = [];
function mesh(geo, mat, x=0, y=0, z=0, parent=scene){
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
// specific labels first, general ones last: a mesh keeps the first label it gets
function tag(obj, text){
  obj.traverse(o => { if (o.isMesh && !o.userData.label) { o.userData.label = text; hoverables.push(o); } });
}
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  t.userData = {g, w, h}; return t;
}
function textTex(lines, {w=1024, h=512, bg='#fff8e7', sizes=[90], colors=['#2b2b2b'], border=null}={}){
  return canvasTex(w, h, g => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    if (border) { const lw = Math.round(h*0.06); g.strokeStyle = border; g.lineWidth = lw; g.strokeRect(lw/2, lw/2, w-lw, h-lw); }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((t, i) => {
      g.font = `800 ${sizes[Math.min(i, sizes.length-1)]}px ${FONT}`;
      g.fillStyle = colors[Math.min(i, colors.length-1)];
      g.fillText(t, w/2, h*(i+1)/(lines.length+1));
    });
  });
}
function faceMats(side, front){ return [side, side, side, side, front, side]; }

// shared materials
const wallMat = M('#f4ead6'), woodMat = M('#7a4e2d'), darkWood = M('#5a3820');
const stoneMat = M('#9b8b75');

// ---------- island
mesh(new THREE.CylinderGeometry(34, 33.4, 0.8, 72), M('#7cc35a'), 0, -0.4, 0);
mesh(new THREE.CylinderGeometry(33.4, 25, 7, 72), M('#8a6a44'), 0, -4.3, 0);
const seaMat = M('#5fb3d9', {roughness:0.25, metalness:0.1});
const sea = mesh(new THREE.CircleGeometry(400, 64), seaMat, 0, -2.4, 0);
sea.rotation.x = -Math.PI/2; sea.castShadow = false;

// stepping-stone path to the front door
const pathMat = M('#d9c9a3');
for (let i = 0; i < 9; i++) mesh(new THREE.CylinderGeometry(0.9, 0.95, 0.14, 14), pathMat, -2 + Math.sin(i*0.6)*0.8, 0.07, 6.5 + i*2.2);

// ---------- duck factory (鴨 + 葱)
function makeDuck({scale=1, body='#8a6a4a', head='#1f7a4a', negi=true, carry=null, rank=null, crown=false, cap=null, blush=false}={}){
  const d = new THREE.Group();
  const bodyMat = M(body), headMat = M(head, {roughness:0.45});
  const orange = M('#f2a23a'), white = M('#ffffff'), black = M('#151515');
  const wingMat = M(new THREE.Color(body).multiplyScalar(0.78));
  mesh(new THREE.SphereGeometry(1, 24, 16), bodyMat, 0, 1, 0, d).scale.set(1.25, 0.85, 0.95);
  mesh(new THREE.SphereGeometry(0.62, 24, 16), headMat, 0.95, 1.9, 0, d);
  mesh(new THREE.TorusGeometry(0.42, 0.07, 8, 24), white, 0.88, 1.5, 0, d).rotation.x = Math.PI/2;
  mesh(new THREE.BoxGeometry(0.62, 0.16, 0.46), orange, 1.58, 1.82, 0, d);
  [-0.37, 0.37].forEach(z => mesh(new THREE.SphereGeometry(0.1, 10, 8), black, 1.4, 2.06, z, d));
  mesh(new THREE.ConeGeometry(0.4, 0.8, 8), bodyMat, -1.3, 1.3, 0, d).rotation.z = Math.PI/2.6;
  [-0.4, 0.4].forEach(z => mesh(new THREE.BoxGeometry(0.4, 0.08, 0.32), orange, 0.25, 0.04, z, d));
  d.userData.wings = [-1, 1].map(s => { const w = mesh(new THREE.SphereGeometry(0.6, 16, 10), wingMat, -0.15, 1.15, s*0.82, d); w.scale.set(1.3, 0.6, 0.35); return w; });
  if (carry) { // a member's favourite food, carried where the green onion would be
    const c = carry(); c.position.set(-0.3, 1.72, 0); c.rotation.z = 0.12; d.add(c);
  } else if (negi) { // the green onion it carries on its back
    const ng = new THREE.Group(); ng.position.set(0.05, 1.55, 0.55); ng.rotation.set(0.25, 0, 0.7); d.add(ng);
    mesh(new THREE.CylinderGeometry(0.13, 0.13, 1.4, 10), M('#f4f4ea'), 0, 0, 0, ng);
    mesh(new THREE.CylinderGeometry(0.14, 0.06, 1.9, 10), M('#3fa34d'), 0, 1.6, 0, ng);
    mesh(new THREE.CylinderGeometry(0.1, 0.04, 1.4, 10), M('#5cbf55'), 0.12, 1.3, 0.1, ng).rotation.z = -0.35;
  }
  if (crown) {
    const goldM = M('#f2c94c', {metalness:0.6, roughness:0.3, side:THREE.DoubleSide});
    const cr = new THREE.Group(); cr.position.set(0.9, 2.42, 0); d.add(cr);
    mesh(new THREE.CylinderGeometry(0.3, 0.27, 0.18, 16, 1, true), goldM, 0, 0.09, 0, cr);
    for (let k = 0; k < 5; k++) { const a = k/5*Math.PI*2; mesh(new THREE.ConeGeometry(0.07, 0.2, 6), goldM, Math.cos(a)*0.28, 0.27, Math.sin(a)*0.28, cr); }
  }
  if (cap) { // jockey-style cap
    const cm = M(cap, {roughness:0.5});
    mesh(new THREE.SphereGeometry(0.62, 20, 10, 0, Math.PI*2, 0, Math.PI/2), cm, 0.95, 2.2, 0, d).scale.set(1, 0.8, 1);
    mesh(new THREE.BoxGeometry(0.55, 0.05, 0.7), cm, 1.5, 2.22, 0, d);
    mesh(new THREE.SphereGeometry(0.09, 8, 6), M('#ffffff'), 0.95, 2.72, 0, d);
  }
  if (blush) { const pm = M('#ff9fb3'); [-0.5, 0.5].forEach(z => mesh(new THREE.SphereGeometry(0.1, 10, 8), pm, 1.27, 1.84, z, d).scale.set(1, 0.6, 0.45)); }
  if (rank) addGem(d, RANK[rank], 0.95, crown || cap ? 3.35 : 3.15);
  d.scale.setScalar(scale);
  return d;
}

// rank gems: platinum / diamond / master / predator
const RANK = {plat:'#5fd3c8', dia:'#4aa8ff', master:'#a46bff', pred:'#ff3b3b'};
const gems = [];
function addGem(parent, color, x, y){
  const g = mesh(new THREE.OctahedronGeometry(0.3), M(color, {emissive:color, emissiveIntensity:0.45, metalness:0.3, roughness:0.25, flatShading:true}), x, y, 0, parent);
  g.scale.set(1, 1.4, 1); g.userData.y0 = y; gems.push(g); return g;
}

// a chick (ヒナ) for the member who is "past duck, all the way to chick"
function makeChick({scale=1, rank=null}={}){
  const c = new THREE.Group();
  const yellow = M('#ffd84a'), wingY = M('#ffcf33'), orange = M('#ff9f1c'), black = M('#151515');
  mesh(new THREE.SphereGeometry(0.85, 24, 16), yellow, 0, 0.85, 0, c).scale.set(1, 0.95, 0.95);
  mesh(new THREE.SphereGeometry(0.55, 20, 14), yellow, 0.35, 1.75, 0, c);
  mesh(new THREE.ConeGeometry(0.14, 0.32, 10), orange, 0.92, 1.72, 0, c).rotation.z = -Math.PI/2;
  [-0.24, 0.24].forEach(z => mesh(new THREE.SphereGeometry(0.075, 10, 8), black, 0.8, 1.9, z, c));
  [-0.4, 0.4].forEach(z => mesh(new THREE.SphereGeometry(0.08, 8, 6), M('#ff9fb3'), 0.72, 1.68, z, c).scale.set(1, 0.6, 0.4));
  [0, 1].forEach(i => mesh(new THREE.ConeGeometry(0.06, 0.28, 6), yellow, 0.3 + i*0.08, 2.35, (i - 0.5)*0.12, c).rotation.z = 0.3 - i*0.5);
  [-1, 1].forEach(s => mesh(new THREE.SphereGeometry(0.35, 12, 8), wingY, -0.05, 0.95, s*0.78, c).scale.set(1.1, 0.7, 0.35));
  [-0.25, 0.25].forEach(z => mesh(new THREE.BoxGeometry(0.3, 0.06, 0.22), orange, 0.15, 0.03, z, c));
  if (rank) addGem(c, RANK[rank], 0.35, 2.85);
  c.scale.setScalar(scale);
  return c;
}

// small low-poly favourite foods
const FM = {
  white:M('#f6f3ec'), rice:M('#fbfaf5'), beef:M('#8a5a3c'), ginger:M('#e0413a'), egg:M('#fbfbf5'), yolk:M('#ffb300'),
  shrimp:M('#ff8a50'), omelet:M('#ffd23f'), ketchup:M('#d9322f'), dish:M('#c4572a'), cheese:M('#f0c35a'), brown:M('#b5651d'),
  pea:M('#6cc04a'), pot:M('#3a3a3a'), soup:M('#c98b4f'), cabbage:M('#a8d86a'), chive:M('#4fb85a'), chili:M('#d42a1f'),
  dough:M('#d9a066'), icing:M('#ff8fb8'), berry:M('#e8364a'), leaf:M('#3f9b3f'), plateBlue:M('#2b3a55'), tuna:M('#d6334a'),
  salmon:M('#ff8c5a'), daikon:M('#f5f5f0'), karaage:M('#b9692a', {flatShading:true}), lemon:M('#ffe24a'),
  glass:new THREE.MeshStandardMaterial({color:'#f5d78a', transparent:true, opacity:0.8, roughness:0.08}),
  beer:new THREE.MeshStandardMaterial({color:'#f2b632', transparent:true, opacity:0.92, roughness:0.15}),
  foam:M('#fffdf5'), wood:M('#c79a5b'), negitoro:M('#f08a9b'), fried:M('#f2cf6b'), carrot:M('#ff8a3d'), ham:M('#f29ab0'),
  tako:M('#c9883f'), sauce:M('#5a2e14'),
};
const G = () => new THREE.Group();
const FOOD = {
  gyudon(){ const g = G();
    mesh(new THREE.CylinderGeometry(0.5, 0.3, 0.42, 20), FM.white, 0, 0.21, 0, g);
    mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.08, 20), FM.beef, 0, 0.44, 0, g);
    mesh(new THREE.SphereGeometry(0.09, 8, 6), FM.ginger, 0.18, 0.5, 0.12, g);
    mesh(new THREE.SphereGeometry(0.08, 8, 6), FM.ginger, 0.26, 0.5, -0.02, g);
    return g; },
  ebiEgg(){ const g = G();
    mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.06, 20), FM.egg, -0.12, 0.03, 0, g);
    mesh(new THREE.SphereGeometry(0.16, 12, 8, 0, Math.PI*2, 0, Math.PI/2), FM.yolk, -0.12, 0.06, 0, g);
    mesh(new THREE.TorusGeometry(0.2, 0.08, 8, 14, Math.PI*1.3), FM.shrimp, 0.32, 0.2, 0.05, g).rotation.set(Math.PI/2, 0, 0.3);
    return g; },
  omurice(){ const g = G();
    mesh(new THREE.CylinderGeometry(0.55, 0.5, 0.06, 20), FM.white, 0, 0.03, 0, g);
    mesh(new THREE.SphereGeometry(0.4, 16, 10), FM.omelet, 0, 0.2, 0, g).scale.set(1.25, 0.55, 0.75);
    mesh(new THREE.BoxGeometry(0.55, 0.05, 0.1), FM.ketchup, 0, 0.42, 0, g).rotation.y = 0.3;
    return g; },
  gratin(){ const g = G();
    mesh(new THREE.CylinderGeometry(0.48, 0.42, 0.22, 20), FM.dish, 0, 0.11, 0, g).scale.set(1.25, 1, 0.85);
    mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.05, 20), FM.cheese, 0, 0.23, 0, g).scale.set(1.25, 1, 0.85);
    [[0.15,0.08],[-0.2,-0.05],[0.02,-0.15]].forEach(([x,z]) => mesh(new THREE.SphereGeometry(0.07, 8, 6), FM.brown, x, 0.26, z, g).scale.set(1, 0.4, 1));
    return g; },

function gableGeo(w, d, h, alongX=false){
  const s = new THREE.Shape(); s.moveTo(-w/2, 0); s.lineTo(0, h); s.lineTo(w/2, 0); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {depth:d, bevelEnabled:false});
  g.translate(0, 0, -d/2);
  if (alongX) g.rotateY(Math.PI/2);
  return g;
}

function windowAt(x, y, z, ry=0, w=2.2, h=1.8, parent=house){

}

function drawScreen(t){
  const {g, w, h} = screenTex.userData;
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#ff8a4c'); gr.addColorStop(0.6, '#7a3d7a'); gr.addColorStop(1, '#2a1d4a');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = '#3a2a5c'; g.beginPath(); g.moveTo(0, h); g.lineTo(0, 190); g.lineTo(90, 140); g.lineTo(170, 180);
  g.lineTo(260, 120); g.lineTo(360, 175); g.lineTo(440, 135); g.lineTo(512, 170); g.lineTo(512, h); g.fill();
  g.fillStyle = '#24193f'; g.fillRect(0, 232, w, h-232);
  const cyc = (t*0.05) % 1;
  const left = Math.max(1, 20 - Math.floor(cyc*21));
  g.strokeStyle = 'rgba(120,200,255,0.9)'; g.lineWidth = 4;
  g.beginPath(); g.arc(300, 170, 210*(1-cyc) + 26, 0, Math.PI*2); g.stroke();
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(0, 0, w, 42);
  g.fillStyle = '#fff'; g.font = `800 24px ${FONT}`; g.textBaseline = 'middle';
  g.textAlign = 'left'; g.fillText('SQUAD 3/3', 14, 22);
  g.textAlign = 'right'; g.fillText(`残り ${left} 部隊`, w-14, 22);
  for (let i = 0; i < 3; i++) {
    g.fillStyle = 'rgba(0,0,0,0.4)'; g.fillRect(14, 196+i*26, 150, 18);
    g.fillStyle = ['#7be07b', '#6fd3ff', '#ffb238'][i];
    g.fillRect(14, 196+i*26, 150*(0.55 + 0.45*Math.abs(Math.sin(t*0.7 + i*1.7))), 18);
  }
  if (left === 1) {
    g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(0, 100, w, 80);
    g.fillStyle = '#ffde59'; g.font = `800 54px ${FONT}`; g.textAlign = 'center'; g.fillText('CHAMPION!', w/2, 142);
  }
  screenTex.needsUpdate = true;
}

// hover labels (mouse) / tap labels (touch); clicking or tapping a duck opens its card
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), label = document.getElementById('label');
let hideTimer = null, downAt = null;
function hitTest(e){
  mouse.set(e.clientX/innerWidth*2 - 1, -(e.clientY/innerHeight)*2 + 1);
  ray.setFromCamera(mouse, camera);
  return ray.intersectObjects(hoverables, false)[0];
}
function showLabel(e, hit){
  if (hit) {
    label.textContent = hit.object.userData.label; label.style.display = 'block';
    label.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - label.offsetWidth - 8)) + 'px';
    label.style.top = Math.max(8, Math.min(e.clientY + 14, innerHeight - label.offsetHeight - 8)) + 'px';
  } else label.style.display = 'none';
  if (e.pointerType !== 'mouse') { clearTimeout(hideTimer); hideTimer = setTimeout(() => label.style.display = 'none', 2500); }
}
const cv = renderer.domElement;
cv.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const h = hitTest(e); showLabel(e, h);
  cv.style.cursor = h && h.object.userData.memberIndex !== undefined ? 'pointer' : '';
});
cv.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
cv.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]); downAt = null;
  if (moved > 6) return;
  const hit = hitTest(e);
  if (hit && hit.object.userData.memberIndex !== undefined) { label.style.display = 'none'; showMember(hit.object.userData.memberIndex); }
  else if (e.pointerType !== 'mouse') showLabel(e, hit);
});
cv.addEventListener('pointerleave', () => { label.style.display = 'none'; });

// ---------- animation loop
const clock = new THREE.Clock();
const tmp = new THREE.Color();
const seaDay = new THREE.Color('#5fb3d9'), seaNight = new THREE.Color('#1b2c55');
const pondDay = new THREE.Color('#4aa3d6'), pondNight = new THREE.Color('#1f3b6e');
const hemiDay = new THREE.Color('#ffffff'), hemiNight = new THREE.Color('#8090c0');
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;

  // day <-> night
  nightT += ((night ? 1 : 0) - nightT) * Math.min(1, dt*2.5);
  tmp.copy(DAY_SKY).lerp(NIGHT_SKY, nightT); scene.background.copy(tmp); scene.fog.color.copy(tmp);
  sun.intensity = 2.2*(1 - nightT); moon.intensity = 0.6*nightT;
  hemi.intensity = 0.9 - 0.6*nightT; hemi.color.copy(hemiDay).lerp(hemiNight, nightT);
  seaMat.color.copy(seaDay).lerp(seaNight, nightT); pondMat.color.copy(pondDay).lerp(pondNight, nightT);
  windowMats.forEach(m => m.emissiveIntensity = 1.6*nightT);
  bulbMats.forEach(m => m.emissiveIntensity = 0.1 + 2.5*nightT);
  lampLights.forEach(l => l.intensity = 25*nightT);
  houseLight.intensity = 30*nightT; boardLight.intensity = 80*nightT;
  stars.material.opacity = nightT;
  cloudMat.color.copy(cloudDay).lerp(cloudNight, nightT);
  fireflies.material.opacity = nightT*(0.6 + 0.4*Math.sin(t*3));
  beamMat.opacity = 0.18 + 0.08*Math.sin(t*2) + 0.25*nightT;

  // creatures
  pondDucks.forEach((d, i) => {
    const a = t*0.25 + i*2.1, r = 3.2 + i*0.7;
    d.position.set(Math.cos(a)*r, 0.02 + Math.sin(t*2 + i)*0.03, Math.sin(a)*r*0.8);
    d.rotation.y = Math.atan2(-0.8*Math.cos(a), -Math.sin(a));
  });
  wanderers.forEach(m => {
    const a = t*m.s + m.off;
    m.d.position.set(m.c[0] + Math.cos(a)*m.r, Math.max(0, Math.sin(t*6 + m.hop))*0.22, m.c[1] + Math.sin(a)*m.r);
    m.d.rotation.y = Math.atan2(-m.s*Math.cos(a), -m.s*Math.sin(a));
    m.d.rotation.z = Math.sin(t*8 + m.hop)*0.06;
  });
  trioDucks.forEach((d, i) => d.position.y = Math.max(0, Math.sin(t*3 + i*2))*0.12);
  if (greeter) { greeter.userData.wings[1].rotation.x = -0.5 + Math.sin(t*7)*0.45; greeter.position.y = Math.max(0, Math.sin(t*2.2))*0.08; }
  if (chick) chick.position.y = Math.max(0, Math.sin(t*4.5))*0.12;
  gems.forEach((g, i) => { g.rotation.y = t*1.6 + i; g.position.y = g.userData.y0 + Math.sin(t*2 + i)*0.08; });
  mascot.rotation.y = -Math.PI/3 + Math.sin(t*0.8)*0.15;

  // scenery
  negiStalks.forEach(g => g.rotation.z = Math.sin(t*1.5 + g.userData.phase)*0.05);
  balloon.position.y = 18 + Math.sin(t*0.6)*0.8; balloon.rotation.y = t*0.1;
  clouds.forEach((c, i) => { const u = c.userData; u.a += dt*(0.008 + i*0.001); c.position.x = Math.cos(u.a)*u.r; c.position.z = Math.sin(u.a)*u.r; c.rotation.y = -u.a; });
  puffs.forEach(p => {
    const k = (t*0.18 + p.userData.phase) % 1;
    p.position.set(-0.2 + k*1.5 + Math.sin(t + p.userData.phase*6)*0.2, 13.3 + k*5, -1.5 - k*0.5);
    p.scale.setScalar(0.6 + k*1.6); p.material.opacity = 0.6*(1 - k);
  });
  const pa = particles.geometry.attributes.position;
  for (let i = 0; i < PN; i++) {
    let y = pa.getY(i) - dt*(i % 3 === 2 ? 0.5 : 0.9); if (y < 0) y = 7;
    pa.setY(i, y); pa.setX(i, pa.getX(i) + Math.sin(t + i)*dt*0.3);
  }
  pa.needsUpdate = true;
  if (t - lastScreen > 0.12) { drawScreen(t); lastScreen = t; }

  // keep the chosen member in view
  if (follow && !fly) {
    memberTarget(follow, _v);
    _w.subVectors(_v, controls.target).multiplyScalar(Math.min(1, dt*6));
    controls.target.add(_w); camera.position.add(_w);
  }
  // camera fly-to
  if (fly) {
    fly.k = Math.min(1, fly.k + dt*0.8); const e = 1 - Math.pow(1 - fly.k, 3);
    camera.position.lerpVectors(fly.fromP, fly.toP, e); controls.target.lerpVectors(fly.fromT, fly.toT, e);
    if (fly.k >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
